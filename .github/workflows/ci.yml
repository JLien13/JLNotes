name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build app
        run: dotnet build src/JLNotes/JLNotes.csproj -c Release

      - name: Run tests
        run: dotnet test tests/JLNotes.Tests/JLNotes.Tests.csproj -c Release
