name: PR Secret Scan (gitleaks)

# Fails a PR if a secret (API key, password, token, private key, etc.) is
# present in the working tree. Free: gitleaks (OSS) on the GitHub-hosted runner.
#
# Scans the CURRENT files (--no-git), not full git history, so it flags
# secrets in the code as it stands. Pre-existing committed secrets WILL trip
# this on the first run -- that's by design. Triage them, then allowlist any
# genuine false positives in the .gitleaks.toml at the repo root.
#
# Same gate as VasoGuard's pr-secret-scan.yml, on a hosted Linux runner
# instead of the self-hosted Windows one.
#
# Trigger: auto on every PR into main, or run manually from the Actions tab
# against a branch.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to scan (e.g. feat/short-slug)'
        required: true
        type: string

  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout ${{ inputs.branch || github.head_ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.head_ref }}
          fetch-depth: 1

      - name: Download gitleaks (pinned)
        run: |
          # Pinned for reproducibility. https://github.com/gitleaks/gitleaks/releases
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Run gitleaks on the working tree
        run: |
          set +e
          ./gitleaks detect --source . --no-git --redact -v \
            --config .gitleaks.toml \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif" \
            --exit-code 1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::gitleaks found potential secrets in the working tree (see findings above)."
            exit 1
          fi
          echo "No secrets detected."
